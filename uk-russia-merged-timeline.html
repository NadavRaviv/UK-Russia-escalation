<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UK–Russia escalation — merged timeline audit, Feb–Sep 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Heebo:wght@400;500;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --base:#0f1419;
    --surface:#161d25;
    --rule:rgba(148,163,184,0.16);
    --text:#e3e9ef;
    --muted:#7f8fa0;
    --faint:#5a6774;
    --green:#4a9e74;
    --red:#c0605a;
    --yellow:#e0b64a;
    --sans:'DM Sans',ui-sans-serif,system-ui,sans-serif;
    --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,monospace;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%;overflow-x:hidden}
  body{
    margin:0;background:var(--base);color:var(--text);
    font-family:var(--sans);line-height:1.5;
    padding:22px 20px 80px;
  }
  body[dir="rtl"]{font-family:'Heebo',var(--sans)}
  .wrap{max-width:760px;margin:0 auto}

  /* --- language toggle --- */
  .langbar{display:flex;justify-content:flex-end;direction:ltr;margin-bottom:18px}
  .toggle{
    display:inline-flex;border:1px solid var(--rule);border-radius:3px;
    background:var(--surface);overflow:hidden;
  }
  .toggle button{
    font-family:var(--mono);font-size:11px;letter-spacing:.1em;
    background:transparent;border:0;color:var(--faint);
    padding:7px 13px;cursor:pointer;transition:color .15s,background .15s;
  }
  .toggle button:hover{color:var(--text)}
  .toggle button[aria-pressed="true"]{background:rgba(148,163,184,0.11);color:var(--text)}
  #btn-he{font-family:'Heebo',var(--sans);letter-spacing:0;font-size:12.5px}

  header{border-bottom:1px solid var(--rule);padding-bottom:24px;margin-bottom:8px}
  .eyebrow{
    font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;
    text-transform:uppercase;color:var(--faint);margin:0 0 12px;
  }
  h1{
    font-size:clamp(26px,6vw,38px);line-height:1.08;margin:0 0 12px;
    font-weight:700;letter-spacing:-0.02em;
  }
  .standfirst{color:var(--muted);font-size:15px;margin:0;max-width:56ch}

  .legend{display:flex;flex-wrap:wrap;gap:10px;margin:24px 0 4px}
  .legend.forms{margin-top:10px}
  .key{
    display:flex;align-items:flex-start;gap:9px;flex:1 1 240px;
    background:var(--surface);border:1px solid var(--rule);
    border-radius:3px;padding:11px 13px;
  }
  .legend.forms .key{flex:1 1 180px;padding:10px 13px}
  .key .swatch{width:11px;height:11px;border-radius:50%;margin-top:4px;flex:none}
  .key .flag{
    width:17px;height:17px;border-radius:50%;overflow:hidden;flex:none;
    margin-top:2px;border:1px solid var(--rule);background:var(--base);
  }
  .key .flag svg{display:block;width:100%;height:100%}
  .key b{display:block;font-size:13px;font-weight:500}
  .key .count{font-family:var(--mono);font-style:normal;color:var(--faint);font-size:11px}
  .key span.d{display:block;font-size:11.5px;color:var(--muted);line-height:1.4}

  /* --- compression panel --- */
  .panel{
    background:var(--surface);border:1px solid var(--rule);border-radius:3px;
    padding:16px 16px 14px;margin:14px 0 34px;
  }
  .panel h3{
    font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--faint);margin:0 0 12px;font-weight:500;
  }
  .stats{display:flex;gap:22px;flex-wrap:wrap;margin-bottom:12px}
  .stat .n{font-family:var(--mono);font-size:23px;font-weight:700;display:block;line-height:1}
  .stat .n .u{font-size:13px}
  .stat .l{font-size:11.5px;color:var(--muted);display:block;margin-top:5px}
  .panel p{font-size:12.5px;color:var(--muted);margin:0;line-height:1.55}
  .panel p + p{margin-top:8px}
  .panel b{color:var(--muted);font-weight:500}

  /* --- timeline --- */
  .timeline{position:relative;padding-left:26px}
  .timeline:before{
    content:"";position:absolute;left:6px;top:6px;bottom:6px;width:1px;
    background:linear-gradient(180deg,transparent,var(--rule) 6%,var(--rule) 94%,transparent);
  }

  .row{position:relative;padding:0 0 0 4px}
  /* flag = who acted; ring colour = the grading */
  .dot{
    position:absolute;left:-28px;top:2px;width:18px;height:18px;
    border-radius:50%;overflow:hidden;background:var(--base);
    border:2px solid var(--base);
    transition:transform .18s ease, box-shadow .18s ease;
  }
  .dot svg{display:block;width:100%;height:100%}
  .row.r .dot{box-shadow:0 0 0 2px var(--red)}
  .row.g .dot{box-shadow:0 0 0 2px var(--green)}
  .row:hover .dot{transform:scale(1.16)}
  .row.r:hover .dot{box-shadow:0 0 0 2px var(--red),0 0 0 7px rgba(192,96,90,.14)}
  .row.g:hover .dot{box-shadow:0 0 0 2px var(--green),0 0 0 7px rgba(74,158,116,.14)}

  time{
    font-family:var(--mono);font-size:11px;letter-spacing:.09em;
    color:var(--yellow);display:block;margin-bottom:3px;
  }
  time .abs{
    opacity:.62;padding-left:8px;margin-left:6px;
    border-left:1px solid rgba(224,182,74,0.32);
  }
  body[dir="rtl"] time .abs{
    padding-left:0;margin-left:0;border-left:0;
    padding-right:8px;margin-right:6px;border-right:1px solid rgba(224,182,74,0.32);
  }
  .side{
    font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;
    border:1px solid var(--rule);border-radius:2px;
    padding:1px 5px 1.5px;margin-right:9px;color:var(--faint);
    display:inline-block;position:relative;top:-1px;
  }
  body[dir="rtl"] .side{
    margin-right:0;margin-left:9px;letter-spacing:0;
    font-family:'Heebo',var(--sans);font-size:10.5px;
  }
  .row h2{font-size:15.5px;font-weight:500;margin:0 0 4px;line-height:1.35}
  .why{font-size:12.5px;color:var(--muted);margin:0 0 6px;line-height:1.5}
  .srcs{display:flex;flex-wrap:wrap;align-items:center;gap:0}
  .src{
    font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;
    color:var(--faint);text-decoration:none;border-bottom:1px solid transparent;
    transition:color .15s, border-color .15s;
  }
  .src:hover{color:var(--text);border-bottom-color:var(--rule)}
  .src.missing{color:#6b5b45}
  .sep{color:var(--rule);font-size:10px;padding:0 8px}
  body[dir="rtl"] .src{letter-spacing:0}

  /* --- gap segments --- */
  .gap{position:relative;display:flex;align-items:center;margin:0;padding:0 0 0 4px}
  .gap .bar{
    position:absolute;left:-20px;top:0;bottom:0;width:1px;
    background:repeating-linear-gradient(180deg,var(--rule) 0 3px,transparent 3px 7px);
  }
  .gap .days{
    display:inline-flex;align-items:center;gap:5px;
    font-family:var(--mono);font-size:10.5px;letter-spacing:.07em;
    padding:3.5px 11px;border-radius:999px;
    border:1px solid;white-space:nowrap;
    transition:transform .18s ease;
  }
  .gap:hover .days{transform:translateX(3px)}
  body[dir="rtl"] .gap:hover .days{transform:translateX(-3px)}

  /* --- band overview: kanban (horizontal) / outline (vertical) --- */
  .overview{margin:0 0 34px}
  .ovhead{
    display:flex;align-items:flex-start;justify-content:space-between;
    gap:12px;flex-wrap:wrap;margin-bottom:4px;
  }
  .ovhead h3{
    font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--faint);margin:0;font-weight:500;padding-top:8px;
  }
  .viewtoggle button{
    font-family:var(--sans);letter-spacing:0;font-size:12px;line-height:1.2;
    padding:6px 12px 7px;display:flex;flex-direction:column;align-items:flex-start;gap:1px;
  }
  body[dir="rtl"] .viewtoggle button{font-family:'Heebo',var(--sans)}
  .viewtoggle .hint{
    font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--faint);font-weight:400;
  }
  body[dir="rtl"] .viewtoggle .hint{
    font-family:'Heebo',var(--sans);letter-spacing:0;text-transform:none;font-size:10.5px;
  }
  .viewtoggle button[aria-pressed="true"] .hint{color:var(--muted)}
  .overview > p.note{font-size:11.5px;color:var(--muted);margin:0 0 13px;max-width:70ch}
  .bands{display:flex;gap:8px;align-items:stretch}
  .band{
    display:flex;flex-direction:column;
    background:var(--surface);border:1px solid var(--rule);border-radius:3px;padding:11px 11px 6px;
  }
  /* Default: one layout only. Outline below 721px, kanban from 721px.
     .layout-* is a user override from the toggle and always wins. */
  @media (max-width: 720px){
    .overview:not(.layout-kanban){
      width:auto;max-width:100%;margin-inline:0;
    }
    .overview:not(.layout-kanban) .bands{flex-direction:column;overflow:visible}
    .overview:not(.layout-kanban) .band{flex:none;width:100%;min-width:0}
  }
  @media (min-width: 721px){
    .overview:not(.layout-outline){
      width:min(1200px, calc(100vw - 40px));
      max-width:calc(100vw - 40px);
      margin-inline:calc((100% - min(1200px, 100vw - 40px)) / 2);
    }
    .overview:not(.layout-outline) .bands{
      flex-direction:row;flex-wrap:nowrap;
      overflow-x:auto;overscroll-behavior-x:contain;
      scrollbar-width:thin;
      scrollbar-color:rgba(148,163,184,.35) transparent;
      padding-bottom:4px;
    }
    .overview:not(.layout-outline) .band{flex:1 1 0;min-width:220px;width:auto}
  }
  .overview.layout-kanban{
    width:min(1200px, calc(100vw - 40px));
    max-width:calc(100vw - 40px);
    margin-inline:calc((100% - min(1200px, 100vw - 40px)) / 2);
  }
  .overview.layout-kanban .bands{
    flex-direction:row;flex-wrap:nowrap;
    overflow-x:auto;overscroll-behavior-x:contain;
    scrollbar-width:thin;
    scrollbar-color:rgba(148,163,184,.35) transparent;
    padding-bottom:4px;
  }
  .overview.layout-kanban .band{flex:1 1 0;min-width:220px;width:auto}
  .overview.layout-outline{width:auto;max-width:100%;margin-inline:0}
  .overview.layout-outline .bands{flex-direction:column;flex-wrap:nowrap;overflow:visible}
  .overview.layout-outline .band{flex:none;width:100%;min-width:0}
  .band .meter{height:3px;border-radius:2px;background:rgba(148,163,184,.13);overflow:hidden;margin-bottom:10px}
  .band .meter i{display:block;height:100%;background:var(--yellow);opacity:.75}
  .band .num{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;color:var(--faint)}
  .band h4{font-size:12.5px;font-weight:500;margin:4px 0 4px;line-height:1.25;overflow-wrap:break-word}
  .band .def{font-size:10.5px;color:var(--muted);line-height:1.4;margin:0 0 9px}
  .band .meta{
    font-family:var(--mono);font-size:9px;letter-spacing:.03em;color:var(--faint);line-height:1.5;
    border-top:1px solid var(--rule);padding-top:7px;margin-bottom:4px;
  }
  body[dir="rtl"] .band .meta,body[dir="rtl"] .band .num{letter-spacing:0;font-family:'Heebo',var(--sans);font-size:10.5px}
  .ev{display:flex;gap:6px;align-items:flex-start;padding:4px 0;border-top:1px solid rgba(148,163,184,0.07)}
  .ev:first-of-type{border-top:0}
  .ev .m{
    width:12px;height:12px;border-radius:50%;overflow:hidden;flex:none;margin-top:2px;
    border:1px solid var(--base);background:var(--base);
  }
  .ev .m svg{display:block;width:100%;height:100%}
  .ev.r .m{box-shadow:0 0 0 1.5px var(--red)}
  .ev.g .m{box-shadow:0 0 0 1.5px var(--green)}
  .ev .t{font-size:11px;line-height:1.3;min-width:0;overflow-wrap:break-word}
  .ev .d{font-family:var(--mono);font-size:9px;letter-spacing:.06em;color:var(--yellow);opacity:.7;display:block;margin-top:1px}
  body[dir="rtl"] .ev .d{letter-spacing:0;font-family:'Heebo',var(--sans);font-size:10px}

  footer{
    margin-top:44px;padding-top:20px;border-top:1px solid var(--rule);
    font-size:11.5px;color:var(--faint);line-height:1.6;
  }
  footer b{color:var(--muted);font-weight:500}

  /* --- RTL --- */
  body[dir="rtl"] .timeline{padding-left:0;padding-right:26px}
  body[dir="rtl"] .timeline:before{left:auto;right:6px}
  body[dir="rtl"] .row{padding:0 4px 0 0}
  body[dir="rtl"] .dot{left:auto;right:-28px}
  body[dir="rtl"] .gap{padding:0 4px 0 0}
  body[dir="rtl"] .gap .bar{left:auto;right:-20px}
  body[dir="rtl"] h1{letter-spacing:0;line-height:1.16}
  body[dir="rtl"] .eyebrow,
  body[dir="rtl"] .panel h3,
  body[dir="rtl"] .ovhead h3{letter-spacing:.06em}
  body[dir="rtl"] time{letter-spacing:0;font-family:'Heebo',var(--sans);font-size:11.5px}
  body[dir="rtl"] .gap .days{letter-spacing:0;font-family:'Heebo',var(--sans);font-size:11px}
  body[dir="rtl"] .stat .n,
  body[dir="rtl"] .key .count{direction:ltr;display:inline-block}
  body[dir="rtl"] .stat .n{display:block}

  /* --- Munger insights --- */
  .overview.layout-munger .bands{display:none}
  .overview.layout-munger > .note{display:none}
  .overview.layout-munger .munger-panel{display:block}
  .munger-panel{display:none}
  .munger-panel .intro{font-size:12.5px;color:var(--muted);margin:0 0 16px;max-width:72ch;line-height:1.55}
  .munger-grid{display:grid;gap:10px;grid-template-columns:1fr}
  @media (min-width:721px){.munger-grid{grid-template-columns:1fr 1fr}}
  .munger-card{
    background:var(--surface);border:1px solid var(--rule);border-radius:3px;
    padding:14px 14px 12px;
  }
  .munger-card .bias{
    font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--yellow);margin:0 0 6px;
  }
  body[dir="rtl"] .munger-card .bias{letter-spacing:.04em;font-family:'Heebo',var(--sans);text-transform:none;font-size:10.5px}
  .munger-card h4{font-size:13.5px;font-weight:500;margin:0 0 6px;line-height:1.3}
  .munger-card p{font-size:12px;color:var(--muted);margin:0 0 8px;line-height:1.5}
  .munger-card .watch{
    font-size:12px;color:var(--text);margin:0;padding:8px 10px;
    background:rgba(224,182,74,.08);border-left:2px solid var(--yellow);border-radius:0 2px 2px 0;
  }
  body[dir="rtl"] .munger-card .watch{border-left:0;border-right:2px solid var(--yellow);border-radius:2px 0 0 2px}
  .munger-card .watch b{color:var(--yellow);font-weight:500}

  .munger-gate{
    position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;
    background:rgba(15,20,25,.88);backdrop-filter:blur(4px);
  }
  .munger-gate[hidden]{display:none}
  .munger-modal{
    background:var(--surface);border:1px solid var(--rule);border-radius:4px;
    padding:22px 24px 18px;width:min(320px,calc(100vw - 40px));text-align:center;
  }
  .munger-modal h3{font-size:15px;margin:0 0 6px;font-weight:500}
  .munger-modal > p{font-size:12px;color:var(--muted);margin:0 0 14px}
  .munger-code{
    font-family:var(--mono);font-size:22px;letter-spacing:.35em;text-align:center;
    width:100%;padding:10px 12px;background:var(--base);border:1px solid var(--rule);
    border-radius:3px;color:var(--text);margin-bottom:10px;
  }
  .munger-code:focus{outline:none;border-color:var(--yellow)}
  .munger-err{font-size:11.5px;color:var(--red);margin:0 0 8px}
  .munger-err[hidden]{display:none}
  .munger-actions{display:flex;gap:8px;justify-content:center;margin-top:4px}
  .munger-actions button{
    font-family:var(--sans);font-size:12.5px;padding:8px 16px;border-radius:3px;
    border:1px solid var(--rule);cursor:pointer;background:transparent;color:var(--text);
  }
  body[dir="rtl"] .munger-actions button{font-family:'Heebo',var(--sans)}
  .munger-actions button.primary{background:var(--yellow);color:var(--base);border-color:var(--yellow);font-weight:500}
  .munger-modal.shake{animation:shake .4s ease}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

  @media (prefers-reduced-motion: reduce){
    *{transition:none !important}
    .munger-modal.shake{animation:none}
  }
</style>
</head>
<body dir="ltr">
<div class="wrap">

  <div class="langbar">
    <div class="toggle" role="group" aria-label="Language">
      <button id="btn-en" aria-pressed="true">EN</button>
      <button id="btn-he" aria-pressed="false">עברית</button>
    </div>
  </div>

  <header>
    <p class="eyebrow" id="eyebrow"></p>
    <h1 id="title"></h1>
    <p class="standfirst" id="standfirst"></p>
  </header>

  <div class="legend">
    <div class="key">
      <span class="swatch" style="background:var(--red)"></span>
      <span><b id="k1"></b><span class="d" id="k1d"></span></span>
    </div>
    <div class="key">
      <span class="swatch" style="background:var(--green)"></span>
      <span><b id="k2"></b><span class="d" id="k2d"></span></span>
    </div>
  </div>

  <div class="legend forms">
    <div class="key">
      <span class="flag" id="fl1"></span>
      <span><b id="f1"></b><span class="d" id="f1d"></span></span>
    </div>
    <div class="key">
      <span class="flag" id="fl2"></span>
      <span><b id="f2"></b><span class="d" id="f2d"></span></span>
    </div>
    <div class="key">
      <span class="flag" id="fl3"></span>
      <span><b id="f3"></b><span class="d" id="f3d"></span></span>
    </div>
  </div>

  <div class="panel">
    <h3 id="panelTitle"></h3>
    <div class="stats">
      <div class="stat"><span class="n" style="color:var(--faint)">11.5<span class="u" id="u1"></span></span><span class="l" id="s1"></span></div>
      <div class="stat"><span class="n" style="color:var(--red)">2.0<span class="u" id="u2"></span></span><span class="l" id="s2"></span></div>
      <div class="stat"><span class="n" style="color:var(--faint)">34 → 0</span><span class="l" id="s3"></span></div>
      <div class="stat"><span class="n" style="color:var(--faint)">20 / 13 / 2</span><span class="l" id="s4"></span></div>
    </div>
    <p id="p0"></p>
    <p id="p1"></p>
    <p id="p2"></p>
  </div>

  <section class="overview" id="overview">
    <div class="ovhead">
      <h3 id="ovTitle"></h3>
      <div class="toggle viewtoggle" role="tablist" aria-label="Band layout">
        <button id="btn-kanban" role="tab" aria-controls="bands" aria-pressed="true" aria-selected="true">
          <span class="tab-name" id="tabKanban"></span>
          <span class="hint" id="tabKanbanHint"></span>
        </button>
        <button id="btn-outline" role="tab" aria-controls="bands" aria-pressed="false" aria-selected="false">
          <span class="tab-name" id="tabOutline"></span>
          <span class="hint" id="tabOutlineHint"></span>
        </button>
        <button id="btn-munger" role="tab" aria-controls="munger-panel" aria-pressed="false" aria-selected="false">
          <span class="tab-name" id="tabMunger"></span>
          <span class="hint" id="tabMungerHint"></span>
        </button>
      </div>
    </div>
    <p class="note" id="ovNote"></p>
    <div class="bands" id="bands" role="tabpanel"></div>
    <div class="munger-panel" id="munger-panel" role="tabpanel" hidden>
      <p class="intro" id="mungerIntro"></p>
      <div class="munger-grid" id="mungerGrid"></div>
    </div>
  </section>

  <div class="munger-gate" id="munger-gate" hidden>
    <div class="munger-modal" id="munger-modal">
      <h3 id="mungerGateTitle"></h3>
      <p id="mungerGateHint"></p>
      <input class="munger-code" id="munger-code" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off" aria-label="Access code">
      <p class="munger-err" id="munger-err" hidden></p>
      <div class="munger-actions">
        <button type="button" id="munger-cancel"></button>
        <button type="button" class="primary" id="munger-submit"></button>
      </div>
    </div>
  </div>
  <script>
    (function(){
      var mobile = window.matchMedia("(max-width: 720px)").matches;
      var k = document.getElementById("btn-kanban");
      var o = document.getElementById("btn-outline");
      k.setAttribute("aria-pressed", mobile ? "false" : "true");
      k.setAttribute("aria-selected", mobile ? "false" : "true");
      o.setAttribute("aria-pressed", mobile ? "true" : "false");
      o.setAttribute("aria-selected", mobile ? "true" : "false");
    })();
  </script>

      short:"UK factories not ruled out",
      title:"A Kremlin adviser will not rule out strikes on UK drone factories",
      why:"Andrei Fedorov, a former senior Russian diplomat, declines to exclude a semi-military strike on British plants making drones and missile components — not by Russia, he says, but from unknown sources. The deniability is the point. It is the first threat in this set whose object sits on British soil. CBS dates the remark to the 25th and the Independent to around the 24th; on the earlier dating it falls on the same day as the Kyiv announcement rather than after it." },
    he:{ label:"25 באוגוסט 2026",

    en:{ label:"25 AUG 2026",
      short:"CIA director in Moscow",
      title:"CIA director makes an unannounced visit to Moscow",
      why:"Reported as following a US assessment that Russia may be preparing to test NATO with a limited assault on an allied state, probably in the Baltic. Peskov dismisses that reporting as scare material. The documented driver is American, not British — graded green on that basis. Note a date conflict: the Guardian places the trip on Tuesday, other outlets on Wednesday." },

  { date:"2026-08-25", side:"uk", rag:"r",

    sources:[

      {url:"https://www.ft.com/content/5811d9e6-f48d-43ac-bc05-c273287a27d0", label:"FT (paywalled)", labelHe:"FT (\u05de\u05d0\u05d7\u05d5\u05e8\u05d9 \u05d7\u05d5\u05de\u05ea \u05ea\u05e9\u05dc\u05d5\u05dd)"},
      {url:"https://prepare.campaign.gov.uk/get-prepared-for-emergencies/", label:"GOV.UK Prepare"}],
    en:{ label:"25 AUG 2026",
      short:"Households told to stock up",
      title:"Cabinet Office tells households to stock water and tinned food",
      why:"A Cabinet Office resilience campaign, first reported by the FT and carried by the Guardian on 25 August, will tell households to keep bottled water and tinned food for emergencies \u2014 extreme weather, cyber-attacks, and potential attacks from hostile states \u2014 so most homes can cope and government resources go to the most vulnerable. Work on the \u201cwar book\u201d / home-defence programme is being accelerated alongside. An FT source, quoted by the Independent: \u201ccommon sense, not scaremongering.\u201d Official Prepare pages give WHO-style volumes (2.5\u20133 litres of drinking water per person per day as a minimum; 10 litres for comfort, including cooking and hygiene) as general emergency guidance; the news package links the campaign to hostile-state preparedness. Dated to the Guardian disclosure; the Independent follows on the 26th. Britain is named; no strike target is." },
    he:{ label:"25 באוגוסט 2026",
      short:"משקי בית מתבקשים להצטייד",
      title:"משרד הקבינט קורא למשקי בית להצטייד במים ובשימורים",
      why:"קמפיין חוסן של משרד הקבינט, שדווח לראשונה ב-FT ונישא בגרדיאן ב-25 באוגוסט, יקרא למשקי בית לשמור מים בבקבוקים ומזון משומר לחירום \u2014 מזג אוויר קיצוני, מתקפות סייבר, ותקיפות אפשריות ממדינות עוינות \u2014 כדי שרוב הבתים יוכלו להסתדר ומשאבי הממשלה יופנו לפגיעים ביותר. במקביל מואצת העבודה על \u201dספר המלחמה\u201d / תוכנית ההגנה הביתית. מקור ב-FT, מצוטט באינדיפנדנט: \u201dשכל ישר, לא הפחדה.\u201d דפי Prepare הרשמיים נותנים כמויות בסגנון WHO (2.5\u20133 ליטר מי שתייה לאדם ליום כמינימום; 10 ליטר לנוחות, כולל בישול והיגיינה) כהנחיית חירום כללית; חבילת החדשות מקשרת את הקמפיין למוכנות מול מדינות עוינות. מתוארך לחשיפת הגרדיאן; האינדיפנדנט עוקב ב-26. בריטניה נקובה; אין יעד תקיפה." } },

    en:{ label:"26 AUG 2026",

      why:"שלושה גורמים המקורבים לקרמלין מתארים תקיפות בליסטיות כבדות יותר על קייב, כולל מרכז העיר. המשפט המהותי לציר הזמן הזה: מוסקבה מתייחסת יותר ויותר לתקיפות אוקראיניות כאל תקיפות של מדינות נאט\u201dו, בטענה שאותן מדינות מספקות את הנשק ואת המודיעין. מקורות אנונימיים, כלי תקשורת מקורי אחד." } },

      title:"Zakharova: British military targets could be struck",
      why:"At the foreign ministry briefing: British installations and equipment \u201cin Ukraine and beyond its borders\u201d could be targeted, and London is one step from legal complicity in what she calls terrorism. Moscow separately says Britain is playing with fire. Reuters assesses it as the strongest warning Russia has issued to Britain. The MoD replies that Britain stands shoulder to shoulder with Ukraine." },
    he:{ label:"27 באוגוסט 2026",

      title:"זכרובה: מטרות צבאיות בריטיות עלולות להיות מותקפות",
      why:"בתדריך משרד החוץ: מתקנים וציוד בריטיים \u201dבאוקראינה ומחוץ לגבולותיה\u201d עלולים להפוך למטרות, ולונדון נמצאת צעד אחד מהיותה שותפה משפטית למה שהיא מכנה טרור. במקביל מוסקבה אומרת שבריטניה משחקת באש. רויטרס מעריכה שזו האזהרה החריפה ביותר שרוסיה הפנתה לבריטניה. משרד ההגנה הבריטי משיב שבריטניה עומדת כתף אל כתף עם אוקראינה." } },

  { date:"2026-09-01", side:"ru", rag:"r",

    en:{ label:"1 SEP 2026",
      short:"Departure called routine",
      title:"Moscow says the ambassador's departure was routine",
      why:"Zakharova says Kelin's posting ended as scheduled and a successor will be named when Putin is ready, telling a reporter to \u201ccalm down\u201d about the idea of a formal downgrade. A chargé d'affaires is running the embassy. She describes relations with Britain as at a dire point in the same breath. This cuts against the reading placed on the 23 August row, and is logged for that reason." },
    he:{ label:"1 בספטמבר 2026",
      short:"העזיבה מוגדרת שגרתית",
      title:"מוסקבה: עזיבת השגריר הייתה שגרתית",
      why:"זכרובה אומרת שכהונתו של קלין הסתיימה כמתוכנן ושמחליף ימונה כשפוטין יהיה מוכן, ומורה לכתב \u201d\u05dc\u05d4\u05d9\u05e8\u05d2\u05e2\u201d בנוגע לרעיון של הורדת דרג רשמית. ממונה על העסקים מנהל את השגרירות. באותה נשימה היא מתארת את היחסים עם בריטניה כנמצאים בנקודה קשה. הדבר סותר את הקריאה שהוצמדה לשורה של 23 באוגוסט, ונרשם דווקא משום כך." } },

  { date:"2026-09-02", side:"ru", rag:"r",
    band:4,
    sources:[
      {url:"https://www.independent.co.uk/news/world/europe/ukraine-russia-war-live-putin-zelensky-uk-germany-b3043169.html", label:"Independent"},
      {url:"https://tass.com/politics/2180923", label:"TASS (state)", labelHe:"TASS (\u05de\u05de\u05dc\u05db\u05ea\u05d9)"}],
    en:{ label:"2 SEP 2026",
      short:"Putin will not rule out",
      title:"Putin will not rule out strikes on British-linked sites",
      why:"Speaking in Bishkek, Putin declines to rule out strikes on British military or weapons-production sites, calling the question a military secret, and says any military facility in Ukraine — British ones included — is a legitimate target. Two distinct claims: the second asserts something about Ukraine, the first only refuses to deny. What changes here is the rank of the speaker rather than the target — a former diplomat on 25 August, the foreign ministry on the 27th, the president on the 2nd." },
    he:{ label:"2 בספטמבר 2026",
      short:"פוטין אינו שולל",
      title:"פוטין אינו שולל תקיפות באתרים הקשורים לבריטניה",
      why:"בהתבטאות בבישקק, פוטין נמנע מלשלול תקיפות על אתרים צבאיים או מפעלי נשק בריטיים, מכנה את השאלה סוד צבאי, ואומר שכל מתקן צבאי באוקראינה — כולל בריטי — הוא מטרה לגיטימית. שתי טענות נפרדות: השנייה קובעת משהו לגבי אוקראינה, הראשונה רק מסרבת להכחיש. מה שמשתנה כאן הוא דרגת הדובר ולא המטרה — דיפלומט לשעבר ב-25 באוגוסט, משרד החוץ ב-27, והנשיא ב-2 בספטמבר." } },

  { date:"2026-09-06", side:"ru", rag:"r",
    band:4,
    sources:[
      {url:"https://inews.co.uk/news/imitation-game-putins-shadow-fleet-tankers-disguise-4749413", label:"The i Paper"},
      {url:"https://www.timesnowworld.com/us-news/russian-shadow-fleet-ais-manipulation-uk-sanctions-evasion-article-156102098", label:"Times Now World (synd.)", labelHe:"Times Now World (\u05e2\u05d9\u05d1\u05d5\u05d3 \u05de\u05d7\u05d3\u05e9)"},
      {url:"https://inews.co.uk/news/uk-forces-putins-shadow-fleet-into-open-4748764", label:"The i Paper (7 Sep)"}],
    en:{ label:"6 SEP 2026",
      short:"AIS handshake off UK",
      title:"Shadow-fleet tankers swap AIS identities off the British Isles",
      why:"The i Paper reports sanctioned Russian tankers using AIS \u201chandshakes\u201d off the British Isles \u2014 briefly swapping identity with smaller vessels, often fishing boats, so they appear as clean traffic, especially at choke points. Gonzalo Saiz Erausquin (RUSI) links a rise in that trick, plus spoofed positions and going dark, to the diversion around northern Scotland and west of Ireland after Britain boarded the tanker Smyrtos in June. Joshua Tallis (CNA) says the aim is avoiding a boarding. The MoD says Putin relies on the shadow fleet to fund the war, and that UK forces track, challenge and deter Russian activity in and around UK waters daily. A related i Paper count finds more than 170 such vessels near or through UK waters this summer. Dated to the report." },
    he:{ label:"6 בספטמבר 2026",
      short:"החלפת זהות AIS מול בריטניה",
      title:"מכליות צי הצללים מחליפות זהות AIS מול האיים הבריטיים",
      why:"The i Paper מדווח שמכליות רוסיות מסונקציות מבצעות \u201dלחיצות יד\u201d ב-AIS מול האיים הבריטיים — מחליפות לרגע זהות עם כלי שיט קטנים, לרוב סירות דיג, כך שהן נראות כתנועה נקייה, במיוחד בנקודות מחנק. גונסאלו סאיס אראוסקין (RUSI) מקשר עלייה בתרגיל הזה, וגם בזיוף מיקום ובכיבוי המשדר, למסלול העוקף מצפון לסקוטלנד וממערב לאירלנד אחרי שבריטניה עלתה על המכלית Smyrtos ביוני. ג׳ושוע טאליס (CNA) אומר שהמטרה היא להימנע מהשתלטות. משרד ההגנה הבריטי: פוטין נשען על צי הצללים למימון המלחמה; הכוחות הבריטיים עוקבים אחרי פעילות רוסית במים בריטיים ובסביבתם, מתעמתים איתה ומרתיעים אותה מדי יום. ספירה נלווית באותו עיתון מוצאת יותר מ-170 כלי שיט כאלה ליד מים בריטיים או דרכם בקיץ הזה. מתוארך לדיווח." } },

  { date:"2026-09-08", side:"uk", rag:"g",
    band:1,
    sources:[
      {url:"https://www.independent.co.uk/news/uk/home-news/nats-airlines-norway-england-stourbridge-b2799028.html", label:"Independent"},
      {url:"https://www.insidermedia.com/news/national/airlines-demand-answers-from-air-traffic-control-provider-over-technical-glitch", label:"Insider Media"}],
    en:{ label:"8 SEP 2026",
      short:"NATS system fault",
      title:"UK air-traffic collapse grounds 150+ flights",
      why:"A radar-related technical fault at NATS Swanwick from about 16:00 BST throttles capacity across England and Wales — Cirium counts at least 155 cancellations at Heathrow, Gatwick, Manchester and elsewhere by late evening. Controllers switch to backup within roughly twenty minutes; NATS attributes the outage to its flight-processing system, not to a cyberattack, and says capacity is returning to normal while airlines clear the backlog. Ryanair calls for CEO Martin Rolfe to resign, citing the August 2023 outage. Graded green: the documented driver is domestic infrastructure failure. A separate late-August FulcrumSec leak of Manchester Airports Group customer data is reported as unconnected. No Russia link appears in the reporting as logged; cyber sabotage — including attribution to Moscow — is not in the sources used here." },
    he:{ label:"8 בספטמבר 2026",

    title:"שעונים מבניים מסווגים כרקע",

    fix:"שורות ירוקות לא קישוט. פקיעת אמנה + תרגיל ללא הודעה משנים קו בסיס מו״מ בלי קשר לשגרירויות.",

const FLAGS = {
  uk: '<svg viewBox="0 0 60 30" preserveAspectRatio="xMidYMid slice" aria-hidden="true">'
    + '<rect width="60" height="30" fill="#012169"/>'
    + '<path d="M0 0 60 30M60 0 0 30" stroke="#fff" stroke-width="7"/>'
    + '<path d="M0 0 60 30M60 0 0 30" stroke="#C8102E" stroke-width="3.5"/>'
    + '<path d="M30 0V30M0 15H60" stroke="#fff" stroke-width="11"/>'
    + '<path d="M30 0V30M0 15H60" stroke="#C8102E" stroke-width="6.5"/></svg>',
  ru: '<svg viewBox="0 0 9 6" preserveAspectRatio="xMidYMid slice" aria-hidden="true">'
    + '<rect width="9" height="6" fill="#f5f5f5"/>'
    + '<rect y="2" width="9" height="2" fill="#0039A6"/>'
    + '<rect y="4" width="9" height="2" fill="#D52B1E"/></svg>',
  ot: '<svg viewBox="0 0 39 20" preserveAspectRatio="xMidYMid slice" aria-hidden="true">'
    + '<rect width="39" height="20" fill="#f5f5f5"/>'
    + '<g fill="#B22234"><rect width="39" height="1.54"/><rect y="3.08" width="39" height="1.54"/>'
    + '<rect y="6.15" width="39" height="1.54"/><rect y="9.23" width="39" height="1.54"/>'
    + '<rect y="12.31" width="39" height="1.54"/><rect y="15.38" width="39" height="1.54"/>'
    + '<rect y="18.46" width="39" height="1.54"/></g>'
    + '<rect width="15.6" height="10.77" fill="#3C3B6E"/></svg>'
};

const DAY = 86400000;
const tl = document.getElementById("tl");

function daysAgo(iso){
  const now = new Date(); now.setHours(0,0,0,0);
  return Math.round((now - new Date(iso)) / DAY);
}

function lerpHex(a, b, t){
  const p = h => [1,3,5].map(i => parseInt(h.substr(i,2),16));
  const [r1,g1,b1] = p(a), [r2,g2,b2] = p(b);
  const m = (x,y) => Math.round(x + (y - x) * t);
  return "rgb(" + m(r1,r2) + "," + m(g1,g2) + "," + m(b1,b2) + ")";
}

const set = (id, html) => { document.getElementById(id).innerHTML = html; };

function shortDate(iso, t, approx){
  const d = new Date(iso);
  return (approx ? "~" : "") + d.getUTCDate() + " " + t.months[d.getUTCMonth()];
}

function renderMunger(code){
  const t = T[code];
  const cards = code === "he" ? MUNGER_HE : MUNGER;
  set("mungerIntro", t.mungerIntro);
  set("mungerGateTitle", t.mungerGateTitle);
  set("mungerGateHint", t.mungerGateHint);
  set("munger-err", t.mungerGateErr);
  document.getElementById("munger-submit").textContent = t.mungerGateSubmit;
  document.getElementById("munger-cancel").textContent = t.mungerGateCancel;
  const host = document.getElementById("mungerGrid");
  host.innerHTML = cards.map(c =>
    '<article class="munger-card">' +
      '<p class="bias">' + c.bias + '</p>' +
      '<h4>' + c.title + '</h4>' +
      '<p>' + c.mistake + '</p>' +
      '<p><b>' + t.mungerFix + ':</b> ' + c.fix + '</p>' +
      '<p class="watch"><b>' + t.mungerWatch + ':</b> ' + c.watch + '</p>' +
    '</article>'
  ).join("");
}

function renderBands(code){
  const t = T[code];
  set("ovTitle", t.ovTitle);
  set("ovNote", t.ovNote);
  set("tabKanban", t.ovKanban);
  set("tabKanbanHint", t.ovKanbanHint);
  set("tabOutline", t.ovOutline);
  set("tabOutlineHint", t.ovOutlineHint);
  set("tabMunger", t.ovMunger);
  set("tabMungerHint", t.ovMungerHint);
  document.querySelector(".viewtoggle").setAttribute("aria-label", t.ovViewLabel);
  const host = document.getElementById("bands");
  host.innerHTML = "";

  t.bands.forEach((b, bi) => {
    const rows = EVENTS.filter(e => e.band === bi + 1);
    const ru = rows.filter(e => e.side === "ru").length;
    const uk = rows.filter(e => e.side === "uk").length;
    const ot = rows.length - ru - uk;
    const split = [ru + " " + t.sides.ru, uk + " " + t.sides.uk]
      .concat(ot ? [ot + " " + t.sides.ot] : []).join(" / ");
    const range = rows.length
      ? shortDate(rows[0].date, t, rows[0].approx) + " – " + shortDate(rows[rows.length - 1].date, t, rows[rows.length - 1].approx)
      : "";

    const card = document.createElement("div");
    card.className = "band";
    card.innerHTML =
      '<div class="meter"><i style="width:' + ((bi + 1) * 25) + '%"></i></div>' +
      '<span class="num">' + (bi + 1) + ' / 4</span>' +
      '<h4>' + b.name + '</h4>' +
      '<p class="def">' + b.def + '</p>' +
      '<div class="meta">' + t.metaFmt(rows.length, split, range) + '</div>' +
      rows.map(e =>
        '<div class="ev ' + e.rag + '"><span class="m">' + FLAGS[e.side] + '</span>' +
        '<span class="t">' + e[code].short +
        '<span class="d">' + shortDate(e.date, t, e.approx) + '</span></span></div>'
      ).join("");
    host.appendChild(card);
  });
}

function render(code){
  const t = T[code];
  document.documentElement.lang = t.lang;
  document.body.dir = t.dir;

  set("eyebrow", t.eyebrow);
  set("title", t.title);
  set("standfirst", t.standfirst);
  set("k1", t.k1); set("k1d", t.k1d);
  set("k2", t.k2); set("k2d", t.k2d);
  set("f1", t.f1); set("f1d", t.f1d);
  set("fl1", FLAGS.uk); set("fl2", FLAGS.ru); set("fl3", FLAGS.ot);
  set("f2", t.f2); set("f2d", t.f2d);
  set("f3", t.f3); set("f3d", t.f3d);
  set("panelTitle", t.panelTitle);
  set("u1", t.unit); set("u2", t.unit);
  set("s1", t.s1); set("s2", t.s2); set("s3", t.s3); set("s4", t.s4);
  set("p0", t.p0); set("p1", t.p1); set("p2", t.p2);
  set("foot", t.foot);

  document.getElementById("btn-en").setAttribute("aria-pressed", code === "en");
  document.getElementById("btn-he").setAttribute("aria-pressed", code === "he");

  renderBands(code);
  renderMunger(code);

  tl.innerHTML = "";
  EVENTS.forEach((e, i) => {
    const c = e[code];

    const srcHtml = e.sources.map(s => {
      const label = (code === "he" && s.labelHe) ? s.labelHe : s.label;
      return s.url
        ? '<a class="src" href="' + s.url + '" target="_blank" rel="noopener">' + label + '</a>'
        : '<span class="src missing">' + label + '</span>';
    }).join('<span class="sep">·</span>');

    const row = document.createElement("div");
    row.className = "row " + e.side + " " + e.rag;
    row.innerHTML =
      '<span class="dot">' + FLAGS[e.side] + '</span>' +
      '<time><span class="side">' + t.sides[e.side] + '</span>' +
        t.ago(daysAgo(e.date), e.approx) +
        '<span class="abs">' + c.label + '</span></time>' +
      '<h2>' + c.title + '</h2>' +
      '<p class="why">' + c.why + '</p>' +
      '<div class="srcs">' + srcHtml + '</div>';
    tl.appendChild(row);

    const next = EVENTS[i + 1];
    if (!next) return;

    const days = Math.round((new Date(next.date) - new Date(e.date)) / DAY);
    const soft = e.approx || next.approx;
    const h = Math.round(26 + Math.sqrt(days) * 15);

    // Intensity: pinned at 1.0 for anything two days or under, then falling away
    // on a log scale. Vivid red at the short end, fading toward slate at the long.
    const k = days <= 2 ? 1 : Math.max(0, Math.min(1, 1 - Math.log(days / 2) / Math.log(45)));
    const fill   = lerpHex("#1b232c", "#c0605a", k);
    const stroke = lerpHex("#2a333d", "#d97e77", k);
    const text   = lerpHex("#6c7885", "#fff1ef", Math.pow(k, 0.7));

    const gap = document.createElement("div");
    gap.className = "gap";
    gap.style.height = h + "px";
    gap.innerHTML =
      '<span class="bar"></span>' +
      '<span class="days" style="background:' + fill + ';border-color:' + stroke +
      ';color:' + text + '">' +
      t.gapWord + ' ' +
      (days === 0 ? t.sameDay : (soft ? "~" : "") + days + t.dayUnit) + '</span>';
    tl.appendChild(gap);
  });
}

document.getElementById("btn-en").addEventListener("click", () => render("en"));
document.getElementById("btn-he").addEventListener("click", () => render("he"));

const overview = document.getElementById("overview");
const btnKanban = document.getElementById("btn-kanban");
const btnOutline = document.getElementById("btn-outline");
const btnMunger = document.getElementById("btn-munger");
const mungerPanel = document.getElementById("munger-panel");
const mungerGate = document.getElementById("munger-gate");
const mungerModal = document.getElementById("munger-modal");
const mungerCode = document.getElementById("munger-code");
const mungerErr = document.getElementById("munger-err");
const MOBILE_MQ = window.matchMedia("(max-width: 720px)");
const MUNGER_KEY = "ukru-munger";
const MUNGER_CODE = [5,6,1,9,4,8].join("");
let viewOverride = null;
let mungerPending = false;

function mungerUnlocked(){
  return sessionStorage.getItem(MUNGER_KEY) === "1";
}

function defaultView(){
  return MOBILE_MQ.matches ? "outline" : "kanban";
}

function currentView(){
  return viewOverride || defaultView();
}

function applyView(){
  const view = currentView();
  const isMunger = view === "munger";
  overview.classList.toggle("layout-kanban", viewOverride === "kanban");
  overview.classList.toggle("layout-outline", viewOverride === "outline");
  overview.classList.toggle("layout-munger", isMunger);
  mungerPanel.hidden = !isMunger;
  btnKanban.setAttribute("aria-pressed", view === "kanban" ? "true" : "false");
  btnOutline.setAttribute("aria-pressed", view === "outline" ? "true" : "false");
  btnMunger.setAttribute("aria-pressed", isMunger ? "true" : "false");
  btnKanban.setAttribute("aria-selected", view === "kanban" ? "true" : "false");
  btnOutline.setAttribute("aria-selected", view === "outline" ? "true" : "false");
  btnMunger.setAttribute("aria-selected", isMunger ? "true" : "false");
}

function openMungerGate(){
  mungerPending = true;
  mungerCode.value = "";
  mungerErr.hidden = true;
  mungerGate.hidden = false;
  mungerModal.classList.remove("shake");
  mungerCode.focus();
}

function closeMungerGate(){
  mungerPending = false;
  mungerGate.hidden = true;
  mungerCode.value = "";
  mungerErr.hidden = true;
}

function tryUnlockMunger(){
  if (mungerCode.value === MUNGER_CODE){
    sessionStorage.setItem(MUNGER_KEY, "1");
    closeMungerGate();
    viewOverride = "munger";
    applyView();
    return;
  }
  mungerErr.hidden = false;
  mungerModal.classList.remove("shake");
  void mungerModal.offsetWidth;
  mungerModal.classList.add("shake");
  mungerCode.select();
}

function requestMungerView(){
  if (mungerUnlocked()){
    viewOverride = "munger";
    applyView();
    return;
  }
  openMungerGate();
}

btnKanban.addEventListener("click", () => { viewOverride = "kanban"; applyView(); });
btnOutline.addEventListener("click", () => { viewOverride = "outline"; applyView(); });
btnMunger.addEventListener("click", requestMungerView);
document.getElementById("munger-submit").addEventListener("click", tryUnlockMunger);
document.getElementById("munger-cancel").addEventListener("click", closeMungerGate);
mungerCode.addEventListener("keydown", e => {
  if (e.key === "Enter") tryUnlockMunger();
  if (e.key === "Escape") closeMungerGate();
});
mungerGate.addEventListener("click", e => {
  if (e.target === mungerGate) closeMungerGate();
});
if (MOBILE_MQ.addEventListener) MOBILE_MQ.addEventListener("change", applyView);
else if (MOBILE_MQ.addListener) MOBILE_MQ.addListener(applyView);

applyView();
render("en");
</script>
