<!-- Layout and copy aligned to Claude artifact 43FX18mJY88DT5eWYzpFe1 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Noto+Serif+Hebrew:wght@400;600;700&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="./redesign-options/options-base.css">

<style>
  /* Hallmark · editorial · long-document · design-system: uk-russia-tokens.css
     Stageshow pass: the page is the ground; the lanes are a list of equal framed charts with one
     fixed left label lane each; the event detail is the one raised satellite; UI text sits on the
     12–16px token steps (the old max(12px,1em) floor pushed it all to 16px); chart text is set in
     viewBox units so it lands at 11–15px on screen; every word, number and photo kept. */
:root{
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
body[data-option="c"]{
  --bg:var(--color-paper);--paper:var(--color-paper-2);--ink:var(--color-ink);--soft:var(--color-muted);--rule:var(--color-rule);--grid:var(--color-paper-3);
  --l0:#4A535B;--l1:#6D7882;--l2:#8794A0;--l3:#D7B0AC;--l4:#D08A84;--l5:#C97870;--l6:#C44A40;--l7:#B2221A;--l8:#8C1010;
  --t0:var(--color-ink);--focus:var(--color-focus);--ok:#6bbf8a;--warn:var(--color-accent);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]):not(:has([data-option])){
  --bg:#161B20;--paper:#1C2228;--ink:#E4E7EA;--soft:#9AA5AF;--rule:#343D46;--grid:#262E36;
  --l0:#4A535B;--l1:#6D7882;--l2:#8794A0;--l3:#D7B0AC;--l4:#D08A84;--l5:#C97870;--l6:#C44A40;--l7:#B2221A;--l8:#8C1010;--t0:#E4E7EA;--focus:#7FB2E5;--ok:#6bbf8a;--warn:#e0b64a}}
:root[data-theme="dark"]:not(:has([data-option])){--bg:#161B20;--paper:#1C2228;--ink:#E4E7EA;--soft:#9AA5AF;--rule:#343D46;--grid:#262E36;
  --l0:#4A535B;--l1:#6D7882;--l2:#8794A0;--l3:#D7B0AC;--l4:#D08A84;--l5:#C97870;--l6:#C44A40;--l7:#B2221A;--l8:#8C1010;--t0:#E4E7EA;--focus:#7FB2E5;--ok:#6bbf8a;--warn:#e0b64a}
:root[data-theme="light"]{color-scheme:light}
:root[data-theme="dark"]{color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{font-variant-numeric:tabular-nums}
  .page{padding-block-start:var(--space-4xl)}
  .topbar{display:none}
  header h1{font-size:var(--text-3xl)}
  .lede{font-size:var(--text-md);color:var(--color-ink)}
  .win.active{background:var(--color-accent);color:var(--color-on-accent);border-color:var(--color-accent)}
  /* Five readings of uneven length: ruled columns on the ground, not five boxes with a void at the bottom. */
  .compare-card{background:none;border:0;border-top:var(--rule-hair) solid var(--color-rule);border-radius:0}
main{max-width:var(--page-max);margin:0 auto;padding:var(--nav-clearance, var(--space-5xl)) var(--page-gutter) var(--space-3xl)}
h1,h2,h3{font-family:var(--font-display);font-weight:600;line-height:var(--leading-tight);margin:0}
h1{font-size:var(--text-3xl);max-width:24ch;letter-spacing:-.02em}
h2{font-size:var(--text-2xl);margin-bottom:var(--space-sm)}
h2.other-escalations{
  font-style:normal;font-weight:700;font-size:var(--text-hero-s);
  letter-spacing:-0.02em;margin:var(--space-md) 0 var(--space-lg);max-width:16ch;
}
h3{font-size:var(--text-lg);margin:var(--space-lg) 0 var(--space-xs)}
p{margin:0 0 var(--space-sm);max-width:72ch;color:var(--soft)}
.lede{font-size:var(--text-base);color:var(--soft);margin-top:var(--space-sm);max-width:var(--measure);line-height:var(--leading-body)}
a{color:var(--color-accent)}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
section{margin-top:var(--space-2xl);padding-top:var(--space-xs);border-top:1px solid var(--rule)}
.topbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:var(--space-sm);margin-bottom:var(--space-xs)}
.topbar a{font-size:var(--text-sm);font-weight:500;text-decoration:none}
.theme-btn{border:var(--rule-hair) solid var(--rule);border-radius:var(--radius-sm);background:var(--paper);color:var(--soft);cursor:pointer;padding:var(--space-xs) var(--space-sm);font-size:var(--text-sm);font-weight:500}
.ladder-note{font-size:var(--text-base);color:var(--soft);max-width:68ch;margin:var(--space-sm) 0 var(--space-md)}
.ladder-bar{display:grid;grid-template-columns:repeat(9,1fr);gap:2px;margin:var(--space-md) 0 var(--space-xs);border-radius:var(--radius-sm);overflow:hidden}
.ladder-seg{padding:var(--space-sm) var(--space-xs) var(--space-sm);font-size:var(--text-xs);line-height:var(--leading-snug);color:var(--ink);min-height:88px}
.ladder-seg .num{font-family:var(--font-mono);font-weight:700;font-size:var(--text-xs);display:block;margin-bottom:var(--space-2xs)}
.ladder-seg .ttl{font-weight:600;display:block;margin-bottom:2px}
.ladder-seg .def{color:inherit;opacity:.92;font-size:var(--text-xs);display:block;line-height:var(--leading-snug)}
.ladder-seg[data-r="0"]{background:var(--l0);color:var(--color-on-photo)}
.ladder-seg[data-r="1"]{background:var(--l1);color:var(--color-on-photo)}
.ladder-seg[data-r="2"]{background:var(--l2);color:var(--color-on-scale)}
.ladder-seg[data-r="3"]{background:var(--l3);color:var(--color-on-scale)}
.ladder-seg[data-r="4"]{background:var(--l4);color:var(--color-on-scale)}
.ladder-seg[data-r="5"]{background:var(--l5);color:var(--color-on-scale)}
.ladder-seg[data-r="6"]{background:var(--l6);color:var(--color-on-photo)}
.ladder-seg[data-r="7"]{background:var(--l7);color:var(--color-on-photo)}
.ladder-seg[data-r="8"]{background:var(--l8);color:var(--color-on-photo)}
.ladder-seg .def{color:inherit;opacity:1}
@media(max-width:720px){.ladder-bar{grid-template-columns:1fr 1fr}.ladder-seg{min-height:auto}}
.window-btns{display:flex;flex-wrap:wrap;gap:var(--space-xs);margin:var(--space-md) 0 var(--space-sm)}
.window-btns button{min-height:var(--tap-min);border:var(--rule-hair) solid var(--rule);background:var(--paper);color:var(--soft);padding:0 var(--space-md);border-radius:var(--radius-pill);font-size:var(--text-sm);font-weight:600;cursor:pointer}
.window-btns button.active{background:var(--color-accent);color:var(--color-on-accent);border-color:var(--color-accent)}
.controls{display:flex;flex-wrap:wrap;align-items:flex-start;gap:var(--space-sm) var(--space-md);margin:0 0 var(--space-md);font-size:var(--text-sm);color:var(--soft)}
.controls label{display:inline-flex;align-items:center;gap:var(--space-xs);cursor:pointer}
.controls input{accent-color:var(--focus);width:16px;height:16px}
.hint{font-size:var(--text-sm);color:var(--soft);margin:0 0 var(--space-md)}
/* One lane = one framed chart. Title, range and stats are one item: 4px apart, then the frame. */
.lane{border:var(--rule-hair) solid var(--rule);border-radius:var(--radius-md);background:var(--paper);margin:0 0 var(--space-lg);overflow:hidden}
.lane-head{padding:var(--space-md) var(--space-md) var(--space-sm);border-bottom:var(--rule-hair) solid var(--rule)}
.lane-head .title{font-family:var(--font-display);font-weight:700;font-size:var(--text-md);letter-spacing:-0.01em;margin:0 0 var(--space-2xs);color:var(--ink)}
.lane-head .sub{font-size:var(--text-sm);color:var(--soft);margin:0 0 var(--space-xs)}
.lane-head .stats{display:flex;flex-wrap:wrap;gap:var(--space-2xs) var(--space-lg);font-size:var(--text-sm);color:var(--soft);line-height:var(--leading-snug);margin:0}
.lane-head .stat .v{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.lane-chart{padding:var(--space-2xs) var(--space-xs) var(--space-xs);background:var(--paper)}
.lane-chart svg{width:100%;height:auto;display:block}
/* Chart text is in viewBox units (820 desktop / 480 phone), so 11 here lands at 11–15px on screen. */
.lane-chart .tick{font-size:11px;fill:var(--ink);fill-opacity:.72;font-family:var(--font-body)}
.lane-chart .y-label{font-size:11px;fill:var(--ink);fill-opacity:.72;font-family:var(--font-body)}
.lane-chart .anchor-tag{font-size:11px;font-weight:600;fill:var(--ink);font-family:var(--font-body)}
@media(max-width:720px){.lane-chart .tick,.lane-chart .y-label,.lane-chart .anchor-tag{font-size:13px}}
.lane-chart .grid{stroke:var(--grid);stroke-width:1}
.lane-chart .rung-band{opacity:.18}
.lane-chart .area-fill{opacity:.35}
.lane-chart .line{fill:none;stroke:var(--l2);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.lane-chart .line-solid{stroke:var(--l2)}
.lane-chart .line-dash{stroke:var(--l2);stroke-dasharray:6 4;opacity:.75}
.lane-chart .pt{cursor:pointer;stroke-width:2;stroke:var(--paper)}
.lane-chart .pt.conf{fill:var(--l5)}
.lane-chart .pt.sus{stroke-dasharray:4 3;fill:var(--paper)!important;stroke:var(--l2)!important}
.lane-chart .pt.hollow{fill:var(--paper)!important;stroke:var(--l0)!important;stroke-dasharray:4 3;opacity:.85}
.lane-chart .pt:focus{outline:none}
.lane-foot{padding:var(--space-2xs) var(--space-md) var(--space-sm);font-size:var(--text-xs);color:var(--soft)}
.compare-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:var(--space-md) var(--space-lg);margin-top:var(--space-md)}
.compare-card{padding:var(--space-sm) 0 0}
.compare-card h3{font-size:var(--text-md);margin:0 0 var(--space-2xs);color:var(--ink)}
.compare-card p{font-size:var(--text-sm);margin:0}
.dual-section{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-2xl);margin-top:var(--space-lg);align-items:start}
@media(max-width:900px){.dual-section{grid-template-columns:1fr}}
.overlap-big{font-family:var(--font-body);font-size:var(--text-display);font-weight:700;color:var(--ink);margin:var(--space-xs) 0 var(--space-2xs);line-height:1}
.overlap-big span{font-variant-numeric:tabular-nums}
.overlap-sub{font-size:var(--text-base);color:var(--soft);margin:0 0 var(--space-md);max-width:40ch}
.bar-legend{display:flex;gap:var(--space-md);font-size:var(--text-xs);color:var(--soft);margin-bottom:var(--space-sm)}
.bar-legend i{display:inline-block;width:14px;height:8px;border-radius:2px;vertical-align:middle;margin-inline-end:6px}
.bar-legend .uk{background:var(--l5)}.bar-legend .ua{background:var(--l1)}
/* Fixed tracks: labels, bars and percentages line up down the column. */
.dual-row{display:grid;grid-template-columns:9rem minmax(0,1fr);gap:var(--space-sm);margin:var(--space-sm) 0;font-size:var(--text-xs);color:var(--soft);align-items:center}
.dual-row .lab{font-weight:600;color:var(--ink);font-size:var(--text-xs);line-height:var(--leading-snug)}
.dual-row .bars{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-sm)}
.dual-row .barcell{display:grid;grid-template-columns:minmax(0,1fr) 2.5rem;gap:var(--space-2xs);align-items:center}
.dual-row .track{height:10px;background:var(--grid);border-radius:2px;overflow:hidden}
.dual-row .track i{display:block;height:100%;border-radius:2px}
.dual-row .track .uk{background:var(--l5)}.dual-row .track .ua{background:var(--l1)}
.dual-row .pct{font-size:var(--text-xs);text-align:end;color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.sign-icon{display:inline-block;width:18px;font-weight:700;margin-inline-end:var(--space-2xs)}
.sign-icon.yes{color:var(--ok)}.sign-icon.sus{color:var(--soft);opacity:.7}
/* The selected event is the one raised object on the page. */
.detail{margin:var(--space-lg) 0;padding:var(--space-md) var(--space-lg);border:var(--rule-hair) solid var(--color-rule);border-radius:var(--radius-md);background:var(--color-paper-2);box-shadow:var(--shadow-raised);min-height:56px}
.detail b{display:block;font-family:var(--font-display);font-size:var(--text-lg);font-weight:700;line-height:var(--leading-tight);color:var(--ink);margin-bottom:var(--space-2xs)}
.detail .meta{font-size:var(--text-sm);color:var(--soft);font-weight:500}
.detail .body{font-size:var(--text-base);line-height:var(--leading-body);color:var(--soft);margin-top:var(--space-xs);max-width:72ch}
.signs{list-style:none;padding:0;margin:var(--space-md) 0}
.signs li{padding:var(--space-sm) 0;border-bottom:var(--rule-hair) solid var(--rule);font-size:var(--text-sm);color:var(--soft)}
.signs li b{color:var(--ink);font-weight:600}
.signs .tick-yes{color:var(--ok)}
.signs .tick-no{color:var(--soft)}
.signs .tick-sus{color:var(--warn)}
.prose p{color:var(--soft)}
.prose h3{color:var(--ink)}
.foot{font-size:var(--text-sm);color:var(--soft);margin-top:var(--space-lg)}
html.embed .topbar{display:none}
/* The scale reads left to right in both languages. Prose follows the page direction. */
.lane-chart,.ladder-bar,.dual-row,.dual-row .bars,.dual-row .track{direction:ltr}
main[dir="rtl"] .context__copy,
main[dir="rtl"] .prose,
main[dir="rtl"] .lane-head,
main[dir="rtl"] .ladder-note,
main[dir="rtl"] .hint,
main[dir="rtl"] .signs,
main[dir="rtl"] .detail,
main[dir="rtl"] .compare-card,
main[dir="rtl"] .lane-foot{text-align:right}
html.embed main{padding-top:var(--space-md);padding-bottom:var(--space-3xl)}
@media (prefers-reduced-motion: no-preference){
  .detail > *{animation:detail-settle var(--dur-short) var(--ease-out) both}
  @keyframes detail-settle{from{opacity:0;transform:translateY(4px)}}
}
</style>
</head>

let lang = "en";

function heOn(){ return lang === "he"; }
function esc(s){
  return String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
}
function evTitle(e){ return heOn() && HE[e.title] ? HE[e.title][0] : e.title; }
function evDetail(e){ return heOn() && HE[e.title] ? HE[e.title][1] : (e.detail || ""); }
function rungTitle(r){ return heOn() ? r.heTitle : r.title; }
function rungDef(r){ return heOn() ? r.heDef : r.def; }
function rungAxis(r){ return heOn() ? r.heAxis : r.title; }
function laneName(l){ return heOn() ? l.heName : l.name; }
function laneRange(l){ return heOn() ? l.heRange : l.range; }
function laneAnchor(l){ return heOn() ? l.heAnchor : l.anchorLabel; }

function parseDate(iso){ return new Date(iso + "T12:00:00Z"); }
/** Days relative to anchor: 0 = anchor day, negative = before, positive = after. */
function dayOffsetFromAnchor(iso, anchor){
  return Math.round((parseDate(iso) - parseDate(anchor)) / DAY);
}

function laneStats(events, anchor, beforeAnchorOnly){
  const anchorMs = parseDate(anchor).getTime();
  const confirmed = events.filter(e => !e.suspected && (!beforeAnchorOnly || parseDate(e.date).getTime() < anchorMs));
  const suspected = events.filter(e => e.suspected && parseDate(e.date).getTime() < anchorMs);
  const lineEvs = confirmed.filter(e => !e.indirect && e.rung > 0);
  const pre = lineEvs.filter(e => parseDate(e.date).getTime() < anchorMs);
  const hiConf = pre.length ? Math.max(...pre.map(e => e.rung)) : 0;
  const hiSus = suspected.length ? Math.max(...suspected.map(e => e.rung)) : 0;
  const sixPlusConf = pre.filter(e => e.rung >= 6).length;
  const sixPlusSus = suspected.filter(e => e.rung >= 6).length;
  const cut = anchorMs - 60 * DAY;
  const last60 = pre.filter(e => parseDate(e.date).getTime() >= cut);
  const avg60 = last60.length ? (last60.reduce((s,e) => s + e.rung, 0) / last60.length).toFixed(1) : "—";
  return {hiConf, hiSus, sixPlusConf, sixPlusSus, avg60};
}

function rungVar(n){ return "var(--l" + n + ")"; }

let chartXMin = -420;
const PHONE_MQ = window.matchMedia("(max-width: 720px)");

function renderLadderBar(){
  document.getElementById("ladderBar").innerHTML = RUNGS.map(r =>
    `<div class="ladder-seg" data-r="${r.n}"><span class="num">${r.n}</span><span class="ttl">${esc(rungTitle(r))}</span><span class="def">${esc(rungDef(r))}</span></div>`
  ).join("");
}

function renderLane(lane, showGreen){
  const stats = laneStats(lane.events, lane.anchor, true);
  const ui = UI[lang];
  const hi = stats.hiSus > stats.hiConf
    ? `${stats.hiConf} ${ui.confirmed}, ${stats.hiSus} ${ui.withSuspected}`
    : String(stats.hiConf);
  const six = stats.sixPlusSus
    ? `${stats.sixPlusConf} ${ui.confirmed}, ${stats.sixPlusSus} ${ui.suspectedWord}`
    : String(stats.sixPlusConf);
  const stat = (k, v) => `<span class="stat"><span class="k">${esc(k)}</span> <span class="v">${esc(v)}</span></span>`;
  const statsLine = stat(ui.statHi, hi) + stat(ui.statSix, six) + stat(ui.statAvg, stats.avg60);

  // The chart is drawn in viewBox units. Phones get a narrower box so the rung labels and ticks
  // still land at 9–10px on screen instead of shrinking with the lane.
  const phone = PHONE_MQ.matches;
  const W = phone ? 480 : 820, H = phone ? 300 : 280, padL = phone ? 152 : 124, padR = phone ? 36 : 56, padT = 14, padB = 28;
  const xMin = chartXMin, xMax = 0;
  const yMin = 0, yMax = 8;
  const plotW = W - padL - padR;
  const xScale = d => padL + ((d - xMin) / (xMax - xMin)) * plotW;
  const yScale = r => padT + (1 - (r - yMin) / (yMax - yMin)) * (H - padT - padB);
  const baseY = yScale(0);

  const visible = lane.events.filter(e => {
    const off = dayOffsetFromAnchor(e.date, lane.anchor);
    if (off < xMin || off > xMax) return false;
    if (lane.isUk && e.indirect && !showGreen) return false;
    return true;
  });

  const lineEvents = visible
    .filter(e => !e.indirect && e.rung > 0)
    .sort((a,b) => parseDate(a.date) - parseDate(b.date) || a.rung - b.rung);

  const pts = lineEvents.map(e => ({
    x: xScale(dayOffsetFromAnchor(e.date, lane.anchor)),
    y: yScale(e.rung),
    sus: !!e.suspected
  }));

  let solidD = "";
  let dashD = "";
  let areaD = "";
  if (pts.length) {
    solidD = "M" + pts[0].x.toFixed(1) + "," + pts[0].y.toFixed(1);
    for (let i = 1; i < pts.length; i++) {
      const a = pts[i - 1];
      const b = pts[i];
      const seg = "M" + a.x.toFixed(1) + "," + a.y.toFixed(1) + "L" + b.x.toFixed(1) + "," + b.y.toFixed(1);
      if (a.sus || b.sus) dashD += seg;
      else solidD += "L" + b.x.toFixed(1) + "," + b.y.toFixed(1);
    }
    areaD = solidD + " L" + pts[pts.length - 1].x.toFixed(1) + "," + baseY.toFixed(1) +
      " L" + pts[0].x.toFixed(1) + "," + baseY.toFixed(1) + " Z";
  }

  const grids = [];
  grids.push(`<defs><linearGradient id="areaGrad-${lane.id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#E8A8A8"/><stop offset="100%" stop-color="#FBFBFA" stop-opacity="0"/></linearGradient></defs>`);
  for (let r = 0; r <= 8; r++) {
    const yTop = yScale(r + 0.5);
    const yBot = yScale(r - 0.5);
    const h = Math.max(yBot - yTop, 1);
    grids.push(`<rect class="rung-band" x="${padL}" y="${yTop}" width="${plotW}" height="${h}" fill="${rungVar(r)}"/>`);
  }
  for (let r = 0; r <= 8; r++) {
    const y = yScale(r);
    grids.push(`<line class="grid" x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}"/>`);
    const lab = RUNGS[r];
    grids.push(`<text class="y-label" x="4" y="${y+2}">${r} ${esc(rungAxis(lab))}</text>`);
  }
  const xStep = chartXMin <= -240 ? 60 : 30;
  const dayMark = heOn() ? "י" : "d";
  const anchorName = laneAnchor(lane) || "0";
  for (let d = 0; d >= xMin; d -= xStep) {
    const x = xScale(d);
    grids.push(`<line class="grid" x1="${x}" y1="${padT}" x2="${x}" y2="${H-padB}"/>`);
    grids.push(`<text class="tick" text-anchor="middle" x="${x}" y="${H-6}">${d===0?esc(anchorName):d+dayMark}</text>`);
  }
  grids.push(`<text class="anchor-tag" text-anchor="end" x="${W-8}" y="${padT+12}">${esc(anchorName)}</text>`);

  const dots = visible.map((e, idx) => {
    const x = xScale(dayOffsetFromAnchor(e.date, lane.anchor));
    const y = yScale(e.rung);
    const cls = ["pt", e.suspected ? "sus" : "conf", e.indirect ? "hollow" : ""].filter(Boolean).join(" ");
    const fill = e.indirect ? "var(--paper)" : (e.suspected ? "var(--paper)" : rungVar(Math.max(5, Math.min(8, e.rung))));
    const stroke = e.indirect ? "var(--l0)" : (e.suspected ? "var(--l2)" : "var(--paper)");
    return `<circle class="${cls}" cx="${x}" cy="${y}" r="6" fill="${fill}" stroke="${stroke}" tabindex="0" role="button" data-lane="${lane.id}" data-idx="${idx}" aria-label="${esc(evTitle(e))}"/>`;
  }).join("");

  return `<article class="lane" data-lane-id="${lane.id}">
    <div class="lane-head"><p class="title">${esc(laneName(lane))}</p><p class="sub">${esc(laneRange(lane))}</p><p class="stats">${statsLine}</p></div>
    <div class="lane-chart"><svg viewBox="0 0 ${W} ${H}" aria-hidden="false">${grids.join("")}${areaD?`<path class="area-fill" d="${areaD}" fill="url(#areaGrad-${lane.id})"/>`:""}<path class="line line-solid" d="${solidD}"/><path class="line line-dash" d="${dashD}"/>${dots}</svg></div>
    <div class="lane-foot">${esc(UI[lang].selectPoint)}</div>
  </article>`;
}

function showDetail(lane, ev){
  const el = document.getElementById("detail");
  const ui = UI[lang];
  if (!ev) { el.innerHTML = '<span class="meta">' + esc(ui.detailEmpty) + '</span>'; return; }
  const sus = ev.suspected ? " · " + esc(ui.suspectedTag) : "";
  const ind = ev.indirect ? " · " + esc(ui.indirectTag) : "";
  el.innerHTML = `<b>${esc(evTitle(ev))}</b><div class="meta">${ev.date} · ${esc(ui.rungWord)} ${ev.rung}${sus}${ind}</div><div class="body">${esc(evDetail(ev))}</div>`;
}

function renderAll(){
  const showGreen = document.getElementById("showGreen").checked;
  const russian = LANES.filter(l => l.id === "uk-ru" || l.id === "ru-ua");
  const other = LANES.filter(l => l.id !== "uk-ru" && l.id !== "ru-ua");
  document.getElementById("lanesRussian").innerHTML = russian.map(l => renderLane(l, showGreen)).join("");
  document.getElementById("lanesOther").innerHTML = other.map(l => renderLane(l, showGreen)).join("");
  bindPoints();
}

function bindPoints(){
  document.querySelectorAll(".lane-chart circle[data-lane]").forEach(c => {
    c.addEventListener("click", () => {
      const lane = LANES.find(l => l.id === c.dataset.lane);
      const showGreen = document.getElementById("showGreen").checked;
      const visible = lane.events.filter(e => {
        const off = dayOffsetFromAnchor(e.date, lane.anchor);
        if (off < chartXMin || off > 0) return false;
        if (lane.isUk && e.indirect && !showGreen) return false;
        return true;
      });
      showDetail(lane, visible[+c.dataset.idx]);
    });
  });
}

function rungDistribution(events, anchor){
  const anchorMs = parseDate(anchor).getTime();
  const pre = events.filter(e => !e.suspected && !e.indirect && e.rung > 0 && parseDate(e.date).getTime() < anchorMs);
  const counts = {};
  pre.forEach(e => { counts[e.rung] = (counts[e.rung]||0) + 1; });
  const total = pre.length || 1;
  return [1,2,3,4,5,7].map(r => ({rung:r, pct: Math.round(((counts[r]||0)/total)*100)}));
}

function overlapPct(a, b){
  const keys = [1,2,3,4,5,7];
  let diff = 0;
  keys.forEach(k => {
    const pa = a.find(x => x.rung === k)?.pct || 0;
    const pb = b.find(x => x.rung === k)?.pct || 0;
    diff += Math.abs(pa - pb);
  });
  return Math.round(100 - diff / keys.length);
}

function renderDualBars(ukDist, uaDist){
  const maxPct = 35;
  document.getElementById("dualBars").innerHTML = [1,2,3,4,5,7].map(r => {
    const lab = RUNGS.find(x => x.n === r);
    const uk = ukDist.find(x => x.rung === r)?.pct ?? 0;
    const ua = uaDist.find(x => x.rung === r)?.pct ?? 0;
    const w = p => Math.round(Math.max(p / maxPct * 100, p ? 6 : 0));
    return `<div class="dual-row"><span class="lab">${r} ${esc(rungAxis(lab))}</span><div class="bars">` +
      `<div class="barcell"><div class="track"><i class="uk" style="width:${w(uk)}%"></i></div><span class="pct">${uk}%</span></div>` +
      `<div class="barcell"><div class="track"><i class="ua" style="width:${w(ua)}%"></i></div><span class="pct">${ua}%</span></div>` +
      `</div></div>`;
  }).join("");
}

function renderSigns(){
  document.getElementById("signsList").innerHTML = SIGNS.map(s => {
    const sus = /suspected/i.test(s.uk);
    const icon = sus ? `<span class="sign-icon sus" aria-hidden="true">○</span>` : `<span class="sign-icon yes" aria-hidden="true">✓</span>`;
    const ukLine = heOn() ? s.heUk : (sus ? s.uk : ("UK lane: " + s.uk + "."));
    const uaLine = heOn() ? s.heUa : ("Ukraine lane: " + s.ua + ".");
    return `<li>${icon}<b>${esc(heOn() ? s.heLabel : s.label)}</b><br>${esc(ukLine)}<br>${esc(uaLine)}</li>`;
  }).join("");
}

document.querySelectorAll(".window-btns .win").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".window-btns .win").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    chartXMin = +btn.getAttribute("data-xmin");
    renderAll();
  });
});

  const cur = root.getAttribute("data-theme");

  try { localStorage.setItem("uk-ru-theme", next); } catch (e) {}
});

function applyStatic(){
  const pack = UI[lang];
  document.querySelectorAll("[data-i18n]").forEach(el => {
    const key = el.getAttribute("data-i18n");
    if (pack[key] != null) el.textContent = pack[key];
  });
  document.querySelectorAll("[data-i18n-html]").forEach(el => {
    const key = el.getAttribute("data-i18n-html");
    if (pack[key] != null) el.innerHTML = pack[key];
  });
  document.querySelectorAll("[data-i18n-aria]").forEach(el => {
    const key = el.getAttribute("data-i18n-aria");
    if (pack[key] != null) el.setAttribute("aria-label", pack[key]);
  });
  document.querySelectorAll("[data-i18n-alt]").forEach(el => {
    const key = el.getAttribute("data-i18n-alt");
    if (pack[key] != null) el.alt = pack[key];
  });
  document.title = pack.docTitle;
  document.documentElement.lang = lang;
  const main = document.getElementById("main");
  if (main) {
    main.lang = lang;
    main.dir = heOn() ? "rtl" : "ltr";
  }
}

function paintCharts(){
  renderLadderBar();
  renderAll();
  const ukDist = rungDistribution(UK_EVENTS, UK_ANCHOR);
  const uaLane = LANES.find(l => l.id === "ru-ua");
  const uaDist = rungDistribution(uaLane.events, uaLane.anchor);
  document.getElementById("overlapPctNum").textContent = String(overlapPct(ukDist, uaDist));
  renderDualBars(ukDist, uaDist);
  renderSigns();
}

function setLadderLang(next){
  lang = next === "he" ? "he" : "en";
  applyStatic();
  paintCharts();
}
window.setLadderLang = setLadderLang;

function initialLang(){
  const q = new URLSearchParams(location.search).get("lang");
  if (q === "he" || q === "en") return q;
  try {
    const stored = localStorage.getItem("uk-ru-lang");
    if (stored === "he" || stored === "en") return stored;
  } catch (e) {}
  return "en";
}

setLadderLang(initialLang());

window.addEventListener("message", function(ev){
  if (!ev.data || typeof ev.data !== "object") return;
  if (ev.data.type === "uk-ru-theme" && ev.data.theme) {
    document.documentElement.setAttribute("data-theme", ev.data.theme);
  }
  if ((ev.data.type === "uk-ru-lang") && (ev.data.lang === "he" || ev.data.lang === "en") && ev.data.lang !== lang) {
    setLadderLang(ev.data.lang);
  }
});
