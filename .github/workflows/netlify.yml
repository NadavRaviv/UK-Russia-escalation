# Production deploy to Netlify (static root — see netlify.toml).
# Skips quietly until the repo secrets exist. Repo secrets required: NETLIFY_AUTH_TOKEN, NETLIFY_SITE_ID
# Create token: https://app.netlify.com/user/applications#personal-access-token
# Site ID: Netlify dashboard → Site configuration → General → Site details → API ID
#
# Do not use a third-party `uses:` action here. GitHub downloads every action
# at job start, so a missing or mistyped action fails the check even when this
# step is meant to skip.

name: Deploy Netlify

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Skip when secrets are missing
        if: ${{ env.NETLIFY_AUTH_TOKEN == '' || env.NETLIFY_SITE_ID == '' }}
        run: echo "NETLIFY_AUTH_TOKEN / NETLIFY_SITE_ID not set; skipping production deploy."

      - name: Publish to Netlify
        if: ${{ env.NETLIFY_AUTH_TOKEN != '' && env.NETLIFY_SITE_ID != '' }}
        run: |
          set -euo pipefail
          JSON=$(npx --yes netlify-cli deploy --prod --dir . --no-build --message "Deploy ${{ github.sha }}" --json)
          URL=$(echo "$JSON" | jq -r '.deploy_ssl_url // .url // .deploy_url // empty')
          SITE=$(echo "$JSON" | jq -r '.site_url // empty')
          {
            echo "### Netlify production deploy"
            echo ""
            echo "- **Production URL:** ${URL:-unknown}"
            echo "- **Site URL:** ${SITE:-unknown}"
            echo "- **Commit:** \`${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$URL" ]; then echo "netlify_production_url=$URL" >> "$GITHUB_OUTPUT"; fi

      - name: Note skipped Netlify (for publish approval)
        if: ${{ env.NETLIFY_AUTH_TOKEN == '' || env.NETLIFY_SITE_ID == '' }}
        run: |
          {
            echo "### Netlify production deploy"
            echo ""
            echo "Skipped: \`NETLIFY_AUTH_TOKEN\` / \`NETLIFY_SITE_ID\` not set in repo secrets."
            echo "GitHub Pages may still have deployed; set secrets and re-run this workflow for Netlify."
          } >> "$GITHUB_STEP_SUMMARY"
