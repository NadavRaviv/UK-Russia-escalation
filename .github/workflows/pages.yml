name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare site
        run: |
          mkdir -p _site/images _site/redesign-options
          cp index.html uk-russia-merged-timeline.html uk-russia-plot.html uk-russia-ladder.html uk-russia-tokens.css site-nav.js _site/
          cp images/watchkeeper.jpg images/charlie-munger.jpg images/flag-uk.svg images/flag-ru.svg _site/images/
          cp redesign-options/options-data.js redesign-options/options-shared.js redesign-options/options-base.css redesign-options/option-c.css _site/redesign-options/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
