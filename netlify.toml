[build]
  publish = "."

# COGNEE_API_KEY is set in the Netlify UI, not in this file.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/"
  to = "/uk-russia-plot.html"
  status = 200
  force = true

[[headers]]
  for = "/redesign-options/*"
  [headers.values]
    X-Robots-Tag = "noindex"
