<!DOCTYPE html>
<html lang="en" dir="ltr" data-option="c">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>
try { if (localStorage.getItem("uk-ru-theme") === "dark") document.documentElement.setAttribute("data-theme", "dark"); } catch (e) {}
</script>
<meta name="color-scheme" content="light">
<title>UK–Russia escalation</title>
<meta name="description" content="Forty-two dated UK–Russia events placed by danger and impact, with a date slider, domain filters and sources.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://images.unsplash.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Noto+Serif+Hebrew:wght@400;600;700&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./uk-russia-tokens.css">
<link rel="stylesheet" href="./redesign-options/options-base.css">
<link rel="stylesheet" href="./redesign-options/option-c.css">
</head>
<body>
<main id="main">
  <section class="hero" aria-labelledby="h1" id="hero"></section>

  <section class="section wrap" id="plot" aria-labelledby="plot-h"></section>

  <section class="section wrap" id="timeline" aria-labelledby="tl-h"></section>

</main>

<script src="./redesign-options/options-data.js"></script>
<script src="./redesign-options/options-shared.js"></script>
<script src="./site-nav.js"></script>
<script>
(function () {
  const { U, PHOTOS, DOMAIN_PHOTO, photoFor, img, creditInner, esc, initLang, t, ev, count, sideTag, ringMark, whyHtml, sourcesHtml } = window.UKRU_UI;
  const $ = (id) => document.getElementById(id);
  const N = U.events.length;

  const COPY = {
    en: {
      plot: "Plot", timeline: "Timeline", method: "Method",
      views: "Views", viewsHint: "Open a view of the full tracker", locked: "locked", lockedHint: "Asks for a 6-digit access code",
      viewList: [["danger", "Dangers"], ["outline", "List"], ["kanban", "Bands"], ["domain", "Domain"], ["ladder", "Levels"], ["munger", "Biases & surprises"]],
      plotTitle: "Danger and impact",
      domains: "Filter by domain", all: "All domains", showing: "Showing", through: "through", of: "of",
      slider: "Show events up to", play: "Play through the dates", pause: "Pause", prev: "Earlier", next: "Later", band: "Band",
      listTitle: "Events in date order", showAll: "Show all", showLess: "Show fewer", onPlot: "Show on plot",
      yAxis: "Danger", xAxis: "Impact", selected: "Selected event",
    },
    he: {
      plot: "תרשים", timeline: "ציר הזמן", method: "שיטה",
      views: "תצוגות", viewsHint: "פתיחת תצוגה במעקב המלא", locked: "נעול", lockedHint: "דורש קוד גישה בן 6 ספרות",
      viewList: [["danger", "סכנות"], ["outline", "רשימה"], ["kanban", "רמות"], ["domain", "תחום"], ["ladder", "רמות מעלה/מטה"], ["munger", "הטיות והפתעות"]],
      plotTitle: "סכנה והשפעה",
      domains: "סינון לפי תחום", all: "כל התחומים", showing: "מוצגים", through: "עד", of: "מתוך",
      slider: "הצג אירועים עד", play: "הרצה על פני התאריכים", pause: "עצירה", prev: "קודם", next: "הבא", band: "רמה",
      listTitle: "האירועים לפי תאריך", showAll: "הצג הכול", showLess: "הצג פחות", onPlot: "הצג בתרשים",
      yAxis: "סכנה", xAxis: "השפעה", selected: "האירוע שנבחר",
    },
  };

  const hottest = U.events.reduce((a, b) => (b.danger > a.danger || (b.danger === a.danger && b.impact > a.impact) ? b : a));
  const state = { domain: 0, upTo: N - 1, sel: hottest.id, expand: false };
  let lang = "en";

  // Place events on a 1..10 grid; events sharing a cell are fanned out so every dot stays reachable.
  const POS = (() => {
    const groups = new Map();
    U.events.forEach((e) => {
      const k = e.danger + ":" + e.impact;
      groups.set(k, (groups.get(k) || []).concat(e));
    });
    const out = {};
    groups.forEach((list) => {
      list.forEach((e, i) => {
        const base = { x: 6 + ((e.impact - 1) / 9) * 88, y: 6 + ((e.danger - 1) / 9) * 88 };
        const r = i === 0 ? 0 : 3.6 * Math.sqrt(i);
        const a = i * 2.4 + 0.6;
        out[e.id] = { x: base.x + r * Math.cos(a), y: base.y + r * Math.sin(a) };
      });
    });
    return out;
  })();

  const byId = (id) => U.events.find((e) => e.id === id);
  const visible = (e, idx) => idx <= state.upTo;
  const inDomain = (e) => state.domain === 0 || e.domain === state.domain;

  function shell(L) {
    const u = U.ui[lang];
    const c = COPY[lang];

    $("hero").innerHTML = `<div class="hero__bg">${img("destroyer", { w: 1280, ratio: 1.6, sizes: "100vw", eager: true })}</div>
      <div class="wrap hero__inner">
        <h1 id="h1">${esc(u.title)}</h1>
        <p class="credit visually-hidden">${esc(t("illustrative"))} ${creditInner("destroyer", lang)}</p>
      </div>`;

    const tiles = [`<button type="button" class="tile" role="tab" data-domain="0" aria-selected="${state.domain === 0}" aria-pressed="${state.domain === 0}">${esc(c.all)} <span class="n">${N}</span></button>`]
      .concat(u.domains.map((d, i) => {
        const id = i + 1;
        const n = U.events.filter((e) => e.domain === id).length;
        return `<button type="button" class="tile" role="tab" data-domain="${id}" aria-selected="${state.domain === id}" aria-pressed="${state.domain === id}">${esc(d.name)} <span class="n">${n}</span></button>`;
      }))
      .join("");

    $("plot").innerHTML = `<div class="section__head">
        <h2 id="plot-h" class="visually-hidden">${esc(c.plotTitle)}</h2>
        <p class="legend">
          <span>${sideTag({ side: "ru" })}</span><span>${sideTag({ side: "uk" })}</span><span>${sideTag({ side: "ot" })}</span>
          <span><span class="ring"></span>${esc(u.k1)}</span><span><span class="ring ring--indirect"></span>${esc(u.k2)}</span>
        </p>
      </div>
      <div class="tiles" role="tablist" aria-label="${esc(c.domains)}" id="tiles">${tiles}</div>
      <div class="instrument">
        <div class="instrument__plot">
          <div class="plot-wrap">
            <div class="axis-y mono"><span>${esc(U.ui[lang].dangerHigh)}</span><span>${esc(U.ui[lang].dangerLow)}</span></div>
            <div class="plot" id="plotArea">
              <svg class="plot__grid" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
                ${[1, 2, 3, 4, 6, 7, 8, 9].map((i) => `<line x1="${i * 10}" y1="0" x2="${i * 10}" y2="100"/><line x1="0" y1="${i * 10}" x2="100" y2="${i * 10}"/>`).join("")}
                <line class="mid" x1="50" y1="0" x2="50" y2="100"/><line class="mid" x1="0" y1="50" x2="100" y2="50"/>
              </svg>
              <div id="dots"></div>
            </div>
            <div class="axis-x mono"><span>${esc(U.ui[lang].impactLow)}</span><span>${esc(U.ui[lang].impactHigh)}</span></div>
          </div>
          <div class="timebar">
            <div class="timebar__top"><label for="slider">${esc(c.slider)}</label><output id="sliderOut" for="slider"></output></div>
            <div class="timebar__row">
              <button type="button" class="play" id="play" aria-pressed="false" aria-label="${esc(c.play)}" title="${esc(c.play)}">
                <svg class="play__on" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5 20 12 7 19.5z"/></svg>
                <svg class="play__off" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6.5 4.5h4v15h-4zM13.5 4.5h4v15h-4z"/></svg>
              </button>
              <input type="range" id="slider" min="0" max="${N - 1}" step="1" value="${state.upTo}">
            </div>
          </div>
        </div>
        <article class="card" id="card" aria-live="polite" aria-label="${esc(c.selected)}"></article>
      </div>`;

    $("timeline").innerHTML = `<h2 id="tl-h" class="visually-hidden">${esc(c.listTitle)}</h2>
      <ol class="rows" id="rows"></ol><div class="more" id="more"></div>`;

    $("tiles").addEventListener("click", (ev2) => {
      const b = ev2.target.closest("[data-domain]");
      if (!b) return;
      state.domain = Number(b.dataset.domain);
      $("tiles").querySelectorAll("[data-domain]").forEach((x) => {
        const on = x === b;
        x.setAttribute("aria-pressed", String(on));
        x.setAttribute("aria-selected", String(on));
      });
      update();
    });
    $("play").addEventListener("click", () => { if (playTimer === null) startPlay(); else stopPlay(); });
    $("slider").addEventListener("input", (ev2) => {
      stopPlay();
      state.upTo = Number(ev2.target.value);
      const idx = U.events.findIndex((e) => e.id === state.sel);
      if (idx > state.upTo) state.sel = U.events[state.upTo].id;
      update();
    });
    $("dots").addEventListener("click", (ev2) => {
      const b = ev2.target.closest("[data-id]");
      if (!b) return;
      select(Number(b.dataset.id));
      const again = $("dots").querySelector(`[data-id="${b.dataset.id}"]`);
      if (again) again.focus();
    });
  }

  // Play steps the date slider forward one event at a time, like the old Danger view did.
  let playTimer = null;
  function setPlayLabel(on) {
    const b = $("play");
    if (!b) return;
    b.setAttribute("aria-pressed", String(on));
    b.setAttribute("aria-label", on ? COPY[lang].pause : COPY[lang].play);
    b.setAttribute("title", on ? COPY[lang].pause : COPY[lang].play);
  }
  function stopPlay() {
    if (playTimer === null) return;
    clearInterval(playTimer);
    playTimer = null;
    setPlayLabel(false);
  }
  function startPlay() {
    if (playTimer !== null) return;
    if (state.upTo >= N - 1) state.upTo = 0;
    setPlayLabel(true);
    const tick = () => {
      state.sel = U.events[state.upTo].id;
      $("slider").value = String(state.upTo);
      update();
      if (state.upTo >= N - 1) { stopPlay(); return; }
      state.upTo++;
    };
    tick();
    playTimer = setInterval(tick, 420);
  }

  function select(id, scroll) {
    stopPlay();
    state.sel = id;
    update();
    if (scroll) $("plot").scrollIntoView({ block: "start" });
  }

  function update() {
    const u = U.ui[lang];
    const c = COPY[lang];
    const e0 = U.events[state.upTo];

    $("dots").innerHTML = U.events
      .map((e, idx) => {
        const p = POS[e.id];
        const dim = idx > state.upTo || !inDomain(e);
        return `<button type="button" class="dot dot--${e.side}${e.direct ? "" : " dot--indirect"}" style="--x:${p.x.toFixed(2)};--y:${p.y.toFixed(2)}" data-id="${e.id}" data-dim="${dim}" aria-pressed="${e.id === state.sel}" aria-label="${esc(ev(e).label + ". " + ev(e).title + ". " + t("danger") + " " + e.danger + ", " + t("impact") + " " + e.impact)}" ${dim ? 'tabindex="-1"' : ""}></button>`;
      })
      .join("");

    const shown = U.events.filter((e, idx) => idx <= state.upTo && inDomain(e));
    $("sliderOut").textContent = `${ev(e0).label} · ${shown.length}/${N}`;

    const sel = byId(state.sel);
    const order = shown;
    const at = order.findIndex((e) => e.id === sel.id);
    const prev = at > 0 ? order[at - 1] : null;
    const next = at >= 0 && at < order.length - 1 ? order[at + 1] : null;
    // The card re-mounts (and settles in) only when what it shows has changed; expanding the
    // list or nudging the slider past unrelated rows leaves it still.
    const cardKey = [lang, sel.id, prev ? prev.id : "", next ? next.id : ""].join(":");
    if ($("card").dataset.key !== cardKey) renderCard(sel, prev, next, cardKey);

    const list = shown.slice().reverse();
    const cut = state.expand ? list : list.slice(0, 8);
    $("rows").innerHTML = cut
      .map(
        (e) => `<li>
        <div class="row__date mono"><time datetime="${e.date}">${esc(ev(e).label)}</time>${sideTag(e)} ${ringMark(e)}</div>
        <h3 class="row__title"><button type="button" data-pick="${e.id}" aria-label="${esc(c.onPlot + ": " + ev(e).title)}">${esc(ev(e).title)}</button></h3>
        ${whyHtml(e)}
      </li>`
      )
      .join("");
    $("rows").querySelectorAll("[data-pick]").forEach((b) => b.addEventListener("click", () => select(Number(b.dataset.pick), true)));
    $("more").innerHTML = list.length > 8 ? `<button type="button" class="chip" id="moreBtn">${esc(state.expand ? c.showLess : c.showAll + " (" + list.length + ")")}</button>` : "";
    const mb = $("moreBtn");
    if (mb) mb.addEventListener("click", () => { state.expand = !state.expand; update(); $("moreBtn").focus(); });
  }

  function renderCard(sel, prev, next, cardKey) {
    const c = COPY[lang];
    $("card").dataset.key = cardKey;
    $("card").innerHTML = `<div class="card__body">
        <div class="card__meta mono"><time datetime="${sel.date}">${esc(ev(sel).label)}</time>${sideTag(sel)}<span>${ringMark(sel)} ${esc(sel.direct ? t("direct") : t("indirect"))}</span></div>
        <h3>${esc(ev(sel).title)}</h3>
        <dl class="card__nums">
          <div><dt>${esc(t("danger"))}</dt><dd>${sel.danger}</dd></div>
          <div><dt>${esc(t("impact"))}</dt><dd>${sel.impact}</dd></div>
          <div><dt>${esc(c.band)}</dt><dd>${sel.band}</dd></div>
        </dl>
        <p class="card__why">${esc(ev(sel).why)}</p>
        ${sourcesHtml(sel)}
      </div>
      <div class="card__nav">
        <button type="button" class="chip" data-step="${prev ? prev.id : ""}" ${prev ? "" : "disabled"}>← ${esc(c.prev)}</button>
        <button type="button" class="chip" data-step="${next ? next.id : ""}" ${next ? "" : "disabled"}>${esc(c.next)} →</button>
      </div>`;
    $("card").querySelectorAll("[data-step]").forEach((b, i) =>
      b.addEventListener("click", () => {
        if (b.dataset.step === "") return;
        select(Number(b.dataset.step));
        const again = $("card").querySelectorAll("[data-step]")[i];
        if (again && !again.disabled) again.focus();
      })
    );
  }

  initLang((l) => {
    stopPlay();
    lang = l;
    shell();
    update();
  });
  window.UKRU_NAV.mount({ current: "plot", lang: () => lang });
})();
</script>
</body>
</html>
